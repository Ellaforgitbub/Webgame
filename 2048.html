<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 流暢動態自訂版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #faf8ef;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container { 
            text-align: center; 
            width: 100%;
            max-width: 500px;
        }
        h1 { font-size: 3.5rem; color: #776e65; margin-bottom: 10px; }
        
        /* 頂部控制區 */
        .controls-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .select-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #776e65;
            font-weight: bold;
        }
        
        select {
            padding: 8px 12px;
            font-size: 1rem;
            border: 2px solid #bbada0;
            border-radius: 6px;
            background: #fff;
            color: #776e65;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        .score-box {
            display: flex;
            gap: 10px;
        }
        .score {
            background: #bbada0;
            color: #fff;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            min-width: 90px;
        }
        
        /* 核心響應式網格容器 */
        .grid-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #bbada0;
            border-radius: 10px;
            padding: 12px;
            user-select: none;
        }

        /* 背景網格佈局 */
        .grid-background {
            display: grid;
            grid-template-columns: repeat(var(--grid-size, 4), 1fr);
            grid-template-rows: repeat(var(--grid-size, 4), 1fr);
            gap: 10px;
            width: 100%;
            height: 100%;
        }
        .grid-cell {
            width: 100%;
            height: 100%;
            background: rgba(238, 228, 218, 0.35);
            border-radius: 6px;
        }

        /* 絕對定位的動態方塊容器 */
        .tile-container {
            position: absolute;
            top: 12px; left: 12px;
            right: 12px; bottom: 12px;
            pointer-events: none;
        }

        /* 方塊基本樣式與平滑移動動畫 */
        .tile {
            position: absolute;
            /* 計算出每個方塊的大小與定位 */
            width: calc((100% - (var(--grid-size) - 1) * 10px) / var(--grid-size));
            height: calc((100% - (var(--grid-size) - 1) * 10px) / var(--grid-size));
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: calc(2.2rem - (var(--grid-size) * 0.14rem));
            
            /* 設定移動補間動畫（時間 150ms 讓滑動非常流暢俐落） */
            transition: transform 150ms ease-in-out;
            will-change: transform;
        }

        /* 方塊新生成時的放大縮小特效 (Pop) */
        .tile-new {
            animation: appear 200ms ease-in-out forwards;
        }

        /* 方塊合併時的彈跳視覺反饋 */
        .tile-merged {
            z-index: 2;
            animation: pop 200ms ease-in-out forwards;
        }

        @keyframes appear {
            0% { transform: var(--tile-pos) scale(0); opacity: 0; }
            100% { transform: var(--tile-pos) scale(1); opacity: 1; }
        }

        @keyframes pop {
            0% { transform: var(--tile-pos) scale(1); }
            50% { transform: var(--tile-pos) scale(1.15); }
            100% { transform: var(--tile-pos) scale(1); }
        }
        
        /* 按鈕群組 */
        .btn-group {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            background: #8f7a66;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #7a6658; }
        .btn-success { background: #4caf50; }
        .btn-success:hover { background: #43a047; }
        
        .instructions {
            margin-top: 12px;
            color: #776e65;
            font-size: 0.9rem;
        }
        
        /* 覆蓋層樣式 */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(238, 228, 218, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            padding: 20px;
            z-index: 10;
        }
        .overlay.hidden { display: none; }
        .overlay h2 { font-size: 2.5rem; color: #776e65; margin-bottom: 10px; }
        .overlay p { font-size: 1.3rem; margin-bottom: 20px; color: #776e65; }
        .overlay .overlay-btns {
            display: flex;
            gap: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>2048</h1>
        
        <div class="controls-box">
            <div class="select-wrapper">
                <label for="sizeSelect">網格大小:</label>
                <select id="sizeSelect">
                    <option value="2">2 x 2</option>
                    <option value="4" selected>4 x 4 (經典)</option>
                    <option value="6">6 x 6</option>
                    <option value="8">8 x 8</option>
                    <option value="10">10 x 10</option>
                </select>
            </div>
            <div class="score-box">
                <div class="score">分數: <span id="score">0</span></div>
                <div class="score">最高: <span id="best">0</span></div>
            </div>
        </div>

        <div class="grid-container" id="gridContainer">
            <div id="gridBackground" class="grid-background"></div>
            <div id="tileContainer" class="tile-container"></div>
            
            <div id="gameOver" class="overlay hidden">
                <h2>遊戲結束</h2>
                <p>最終分數: <span id="finalScore">0</span></p>
                <button class="restart-trigger">再試一次</button>
            </div>
            
            <div id="winOverlay" class="overlay hidden">
                <h2>🎉 恭喜達成!</h2>
                <p>你成功合成了 2048 方塊！</p>
                <div class="overlay-btns">
                    <button id="keepPlayingBtn" class="btn-success">繼續挑戰</button>
                    <button class="restart-trigger">重新開始</button>
                </div>
            </div>
        </div>
        
        <div class="btn-group">
            <button id="newGame">新遊戲</button>
        </div>
        <p class="instructions">使用 方向鍵 (Arrow Keys) 或 WASD 移動方塊</p>
    </div>

    <script>
        class Game2048 {
            constructor() {
                this.size = 4;
                this.grid = [];        // 儲存方塊物件：{ id, value, r, c, mergedFrom }
                this.score = 0;
                this.best = parseInt(localStorage.getItem('2048best') || '0');
                this.won = false;
                this.over = false;
                this.keepPlaying = false;
                this.tileIdCounter = 0; // 用於給每個方塊獨立ID，使DOM能追蹤綁定動畫
                this.init();
            }

            init() {
                const container = document.getElementById('gridContainer');
                container.style.setProperty('--grid-size', this.size);

                // 初始化背景網格
                const bg = document.getElementById('gridBackground');
                bg.innerHTML = '';
                for (let i = 0; i < this.size * this.size; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    bg.appendChild(cell);
                }

                this.grid = Array(this.size).fill(null).map(() => Array(this.size).fill(null));
                this.score = 0;
                this.won = false;
                this.over = false;
                this.keepPlaying = false;
                document.getElementById('tileContainer').innerHTML = '';
                
                this.addRandomTile();
                this.addRandomTile();
                this.render();
            }

            setSize(newSize) {
                this.size = parseInt(newSize);
                this.init();
            }

            addRandomTile() {
                const empty = [];
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (!this.grid[r][c]) empty.push({ r, c });
                    }
                }
                if (empty.length > 0) {
                    const { r, c } = empty[Math.floor(Math.random() * empty.length)];
                    const value = Math.random() < 0.9 ? 2 : 4;
                    this.grid[r][c] = {
                        id: this.tileIdCounter++,
                        value: value,
                        r: r,
                        c: c,
                        isNew: true,
                        isMerged: false
                    };
                }
            }

            // 清理前一次移動遺留的動畫標記
            prepareTiles() {
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.grid[r][c]) {
                            this.grid[r][c].isNew = false;
                            this.grid[r][c].isMerged = false;
                        }
                    }
                }
            }

            move(direction) {
                if (this.over || (this.won && !this.keepPlaying)) return;

                this.prepareTiles();
                let moved = false;

                // 根據移動方向取得對應的行列走訪順序
                const vector = this.getVector(direction);
                const traversals = this.buildTraversals(vector);

                traversals.r.forEach(r => {
                    traversals.c.forEach(c => {
                        const tile = this.grid[r][c];
                        if (tile) {
                            const positions = this.findFarthestPosition({ r, c }, vector);
                            const next = positions.next;

                            // 檢查前方是否有方塊可以進行合併
                            if (next && this.grid[next.r][next.c] && 
                                this.grid[next.r][next.c].value === tile.value && 
                                !this.grid[next.r][next.c].isMerged) {
                                
                                // 執行合併
                                const mergedTile = this.grid[next.r][next.c];
                                mergedTile.value *= 2;
                                mergedTile.isMerged = true;
                                this.score += mergedTile.value;

                                if (mergedTile.value === 2048) this.won = true;

                                // 將原方塊移動到目標位置後銷毀
                                this.grid[r][c] = null;
                                tile.r = next.r;
                                tile.c = next.c;
                                
                                // 保留舊節點做滑動動畫，動畫結束後會被清除
                                this.animateMergedTile(tile); 

                                moved = true;
                            } else if (positions.farthest.r !== r || positions.farthest.c !== c) {
                                // 單純滑動到最遠空位
                                this.grid[r][c] = null;
                                tile.r = positions.farthest.r;
                                tile.c = positions.farthest.c;
                                this.grid[tile.r][tile.c] = tile;
                                moved = true;
                            }
                        }
                    });
                });

                if (moved) {
                    this.addRandomTile();
                    this.checkGameOver();
                    this.render();
                }
            }

            getVector(dir) {
                const map = {
                    up:    { r: -1, c: 0 },
                    down:  { r: 1,  c: 0 },
                    left:  { r: 0,  c: -1 },
                    right: { r: 0,  c: 1 }
                };
                return map[dir];
            }

            buildTraversals(vector) {
                const r = [], c = [];
                for (let i = 0; i < this.size; i++) {
                    r.push(i);
                    c.push(i);
                }
                if (vector.r === 1) r.reverse();
                if (vector.c === 1) c.reverse();
                return { r, c };
            }

            findFarthestPosition(cell, vector) {
                let previous;
                do {
                    previous = cell;
                    cell = { r: previous.r + vector.r, c: previous.c + vector.c };
                } while (this.inBounds(cell) && !this.grid[cell.r][cell.c]);

                return {
                    farthest: previous,
                    next: this.inBounds(cell) ? cell : null
                };
            }

            inBounds(cell) {
                return cell.r >= 0 && cell.r < this.size && cell.c >= 0 && cell.c < this.size;
            }

            checkGameOver() {
                // 檢查是否有空位
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (!this.grid[r][c]) return;
                    }
                }
                // 檢查是否可合併
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        const tile = this.grid[r][c];
                        if (r + 1 < this.size && this.grid[r + 1][c].value === tile.value) return;
                        if (c + 1 < this.size && this.grid[r][c + 1].value === tile.value) return;
                    }
                }
                this.over = true;
            }

            // 特殊處理：讓被合併消失的方塊也能做平移滑動，隨後自 DOM 移除
            animateMergedTile(tile) {
                const container = document.getElementById('tileContainer');
                const tileEl = document.getElementById(`tile-${tile.id}`);
                if (tileEl) {
                    const posStr = `translate(calc(${tile.c} * (100% + 10px)), calc(${tile.r} * (100% + 10px)))`;
                    tileEl.style.transform = posStr;
                    setTimeout(() => tileEl.remove(), 150);
                }
            }

            // 顏色對應表
            getColor(v) {
                const c = {
                    2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 
                    32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 
                    512: '#edc850', 1024: '#edc53f', 2048: '#edc22e', 4096: '#b784ab', 
                    8192: '#aa6096', 16384: '#933b7d', 32768: '#4c2e43'
                };
                return c[v] || '#3c3a32';
            }

            getTextColor(v) { return v <= 4 ? '#776e65' : '#f9f6f2'; }

            render() {
                const container = document.getElementById('tileContainer');
                
                // 走訪當前邏輯矩陣，更新或創建 DOM 方塊
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        const tile = this.grid[r][c];
                        if (tile) {
                            let tileEl = document.getElementById(`tile-${tile.id}`);
                            const posStr = `translate(calc(${c} * (100% + 10px)), calc(${r} * (100% + 10px)))`;
                            
                            if (!tileEl) {
                                // 創建新方塊 DOM
                                tileEl = document.createElement('div');
                                tileEl.id = `tile-${tile.id}`;
                                container.appendChild(tileEl);
                            }

                            // 重新整理樣式與定位
                            tileEl.className = `tile`;
                            tileEl.style.backgroundColor = this.getColor(tile.value);
                            tileEl.style.color = this.getTextColor(tile.value);
                            tileEl.textContent = tile.value;
                            
                            // 注入自訂位置 CSS 變數，提供給 Keyframe 作相對動畫
                            tileEl.style.setProperty('--tile-pos', posStr);
                            tileEl.style.transform = posStr;

                            if (tile.isNew) {
                                tileEl.classList.add('tile-new');
                            } else if (tile.isMerged) {
                                tileEl.classList.add('tile-merged');
                            }
                        }
                    }
                }

                // 刷新分數 UI
                document.getElementById('score').textContent = this.score;
                document.getElementById('best').textContent = this.best;
                if (this.score > this.best) {
                    this.best = this.score;
                    localStorage.setItem('2048best', this.best);
                }

                // 排行榜與遮罩彈窗處理
                document.getElementById('gameOver').classList.toggle('hidden', !this.over);
                document.getElementById('winOverlay').classList.toggle('hidden', !(this.won && !this.keepPlaying));

                if (this.over) {
                    document.getElementById('finalScore').textContent = this.score;
                    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                    if (currentUser) {
                        window.parent.postMessage({
                            type: 'gameScore',
                            game: '2048',
                            score: this.score,
                            username: currentUser.username
                        }, '*');
                    }
                }
            }
        }

        const game = new Game2048();

        // 鍵盤移動事件
        document.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            let dir = null;
            if (key === 'arrowup' || key === 'w') dir = 'up';
            else if (key === 'arrowdown' || key === 's') dir = 'down';
            else if (key === 'arrowleft' || key === 'a') dir = 'left';
            else if (key === 'arrowright' || key === 'd') dir = 'right';
            if (dir) {
                e.preventDefault();
                game.move(dir);
            }
        });

        // 尺寸下拉選單監聽
        document.getElementById('sizeSelect').addEventListener('change', (e) => {
            game.setSize(e.target.value);
            e.target.blur();
        });

        // 新遊戲按鈕
        document.getElementById('newGame').addEventListener('click', () => game.init());

        // 重新開始觸發器
        document.querySelectorAll('.restart-trigger').forEach(btn => {
            btn.addEventListener('click', () => game.init());
        });

        // 繼續挑戰
        document.getElementById('keepPlayingBtn').addEventListener('click', () => {
            game.keepPlaying = true;
            game.render();
        });
    </script>
</body>
</html>
