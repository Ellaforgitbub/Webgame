  <!DOCTYPE html>
  <html lang="zh-TW">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>2048</title>
      <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body {
              display: flex;
              justify-content: center;
              align-items: center;
              min-height: 100vh;
              background: #faf8ef;
              font-family: Arial, sans-serif;
          }
          .container { text-align: center; }
          h1 { font-size: 4rem; color: #776e65; margin-bottom: 10px; }
          .score-box {
              display: flex;
              justify-content: center;
              gap: 20px;
              margin-bottom: 20px;
          }
          .score {
              background: #bbada0;
              color: #fff;
              padding: 10px 25px;
              border-radius: 6px;
              font-size: 1.2rem;
          }
          .grid-container {
              display: inline-block;
              background: #bbada0;
              padding: 15px;
              border-radius: 10px;
              position: relative;
          }
          .grid {
              display: grid;
              grid-template-columns: repeat(4, 100px);
              grid-template-rows: repeat(4, 100px);
              gap: 12px;
              background: #bbada0;
              border-radius: 10px;
              padding: 15px;
          }
          .cell-bg {
              background: rgba(238, 228, 218, 0.35);
              border-radius: 6px;
          }
          .cell {
              width: 100px;
              height: 100px;
              border-radius: 6px;
              display: flex;
              justify-content: center;
              align-items: center;
              font-size: 2.2rem;
              font-weight: bold;
          }
          .tile {
              position: absolute;
              width: 100px;
              height: 100px;
              border-radius: 6px;
              display: flex;
              justify-content: center;
              align-items: center;
              font-size: 2.2rem;
              font-weight: bold;
              transition: transform 0.15s ease-out;
          }
          .btn-group {
              margin-top: 20px;
              display: flex;
              justify-content: center;
              gap: 10px;
          }
          button {
              padding: 12px 25px;
              font-size: 1rem;
              background: #8f7a66;
              color: #fff;
              border: none;
              border-radius: 6px;
              cursor: pointer;
          }
          button:hover { background: #7a6658; }
          .instructions {
              margin-top: 15px;
              color: #776e65;
              font-size: 0.9rem;
          }
          .overlay {
              position: absolute;
              top: 0; left: 0; right: 0; bottom: 0;
              background: rgba(238, 228, 218, 0.85);
              display: flex;
              flex-direction: column;
              justify-content: center;
              align-items: center;
              border-radius: 10px;
          }
          .overlay.hidden { display: none; }
          .overlay h2 { font-size: 2.5rem; color: #776e65; }
          .overlay p { font-size: 1.3rem; margin: 10px 0; color: #776e65; }
      </style>
  </head>
  <body>
      <div class="container">
          <h1>2048</h1>
          <div class="score-box">
              <div class="score">分數: <span id="score">0</span></div>
              <div class="score">最高: <span id="best">0</span></div>
          </div>
          <div class="grid-container">
              <div id="grid" class="grid"></div>
              <div id="gameOver" class="overlay hidden">
                  <h2>遊戲結束</h2>
                  <p>最終分數: <span id="finalScore">0</span></p>
              </div>
              <div id="winOverlay" class="overlay hidden">
                  <h2>恭喜!</h2>
                  <p>你達到 2048!</p>
              </div>
          </div>
          <div class="btn-group">
              <button id="newGame">新遊戲</button>
          </div>
          <p class="instructions">使用 方向鍵 或 WASD 移動方塊</p>
      </div>

      <script>
          class Game2048 {
              constructor() {
                  this.size = 4;
                  this.grid = [];
                  this.score = 0;
                  this.best = parseInt(localStorage.getItem('2048best') || '0');
                  this.won = false;
                  this.over = false;
                  this.init();
              }

              init() {
                  this.grid = Array(this.size).fill(null).map(() => Array(this.size).fill(0));
                  this.score = 0;
                  this.won = false;
                  this.over = false;
                  this.addRandomTile();
                  this.addRandomTile();
                  this.render();
              }

              addRandomTile() {
                  const empty = [];
                  for (let r = 0; r < this.size; r++) {
                      for (let c = 0; c < this.size; c++) {
                          if (this.grid[r][c] === 0) empty.push({ r, c });
                      }
                  }
                  if (empty.length > 0) {
                      const { r, c } = empty[Math.floor(Math.random() * empty.length)];
                      this.grid[r][c] = Math.random() < 0.9 ? 2 : 4;
                  }
              }

              move(direction) {
                  if (this.over || this.won) return false;
                  const oldGrid = this.grid.map(row => [...row]);

                  if (direction === 'up') this.slideVertical(-1);
                  else if (direction === 'down') this.slideVertical(1);
                  else if (direction === 'left') this.slideHorizontal(-1);
                  else if (direction === 'right') this.slideHorizontal(1);

                  const moved = !this.gridsEqual(oldGrid, this.grid);
                  if (moved) {
                      this.addRandomTile();
                      this.checkWin();
                      this.checkGameOver();
                  }
                  return moved;
              }

              slideVertical(dir) {
                  for (let c = 0; c < this.size; c++) {
                      let column = [];
                      for (let r = 0; r < this.size; r++) {
                          if (this.grid[r][c] !== 0) column.push(this.grid[r][c]);
                      }
                      if (dir === 1) column.reverse();
                      column = this.mergeLine(column);
                      while (column.length < this.size) column.push(0);
                      if (dir === 1) column.reverse();
                      for (let r = 0; r < this.size; r++) this.grid[r][c] = column[r];
                  }
              }

              slideHorizontal(dir) {
                  for (let r = 0; r < this.size; r++) {
                      let row = this.grid[r].filter(v => v !== 0);
                      if (dir === 1) row.reverse();
                      row = this.mergeLine(row);
                      while (row.length < this.size) row.push(0);
                      if (dir === 1) row.reverse();
                      this.grid[r] = row;
                  }
              }

              mergeLine(line) {
                  const result = [];
                  let i = 0;
                  while (i < line.length) {
                      if (i + 1 < line.length && line[i] === line[i + 1]) {
                          const newVal = line[i] * 2;
                          result.push(newVal);
                          this.score += newVal;
                          i += 2;
                      } else {
                          result.push(line[i]);
                          i++;
                      }
                  }
                  return result;
              }

              gridsEqual(a, b) {
                  for (let r = 0; r < this.size; r++) {
                      for (let c = 0; c < this.size; c++) {
                          if (a[r][c] !== b[r][c]) return false;
                      }
                  }
                  return true;
              }

              checkWin() {
                  for (let r = 0; r < this.size; r++) {
                      for (let c = 0; c < this.size; c++) {
                          if (this.grid[r][c] === 2048) this.won = true;
                      }
                  }
              }

              checkGameOver() {
                  for (let r = 0; r < this.size; r++) {
                      for (let c = 0; c < this.size; c++) {
                          if (this.grid[r][c] === 0) return;
                      }
                  }
                  for (let r = 0; r < this.size; r++) {
                      for (let c = 0; c < this.size; c++) {
                          const val = this.grid[r][c];
                          if (r + 1 < this.size && this.grid[r + 1][c] === val) return;
                          if (c + 1 < this.size && this.grid[r][c + 1] === val) return;
                      }
                  }
                  this.over = true;
              }

              getColor(v) {
                  const c = {
                      0: '#3c3a32', 2: '#eee4da', 4: '#ede0c8', 8: '#f2b179',
                      16: '#f59563', 32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72',
                      256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#edc22e'
                  };
                  return c[v] || '#3c3a32';
              }

              getTextColor(v) { return v <= 4 ? '#776e65' : '#f9f6f2'; }

              render() {
                  const gridEl = document.getElementById('grid');
                  gridEl.innerHTML = '';
                  for (let r = 0; r < this.size; r++) {
                      for (let c = 0; c < this.size; c++) {
                          const v = this.grid[r][c];
                          const cell = document.createElement('div');
                          cell.className = 'cell';
                          cell.style.backgroundColor = this.getColor(v);
                          cell.style.color = this.getTextColor(v);
                          cell.textContent = v || '';
                          gridEl.appendChild(cell);
                      }
                  }
                  document.getElementById('score').textContent = this.score;
                  document.getElementById('best').textContent = this.best;

                  if (this.score > this.best) {
                      this.best = this.score;
                      localStorage.setItem('2048best', this.best);
                  }

                  document.getElementById('gameOver').classList.toggle('hidden', !this.over);
                  document.getElementById('winOverlay').classList.toggle('hidden', !this.won);
                  if (this.over) document.getElementById('finalScore').textContent = this.score;
              }
          }

          const game = new Game2048();

          document.addEventListener('keydown', e => {
              const key = e.key.toLowerCase();
              let dir = null;
              if (key === 'arrowup' || key === 'w') dir = 'up';
              else if (key === 'arrowdown' || key === 's') dir = 'down';
              else if (key === 'arrowleft' || key === 'a') dir = 'left';
              else if (key === 'arrowright' || key === 'd') dir = 'right';
              if (dir) {
                  e.preventDefault();
                  if (game.move(dir)) game.render();
              }
          });

          document.getElementById('newGame').addEventListener('click', () => {
              game.init();
          });
      </script>
  </body>
  </html>
