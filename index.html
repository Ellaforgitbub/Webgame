<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 遊戲大廳</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow-x: hidden;
        }

        /* ===== Header（使用者資訊） ===== */
        #header {
            position: fixed;
            top: 0;
            right: 0;
            padding: 20px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-name {
            color: #fff;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .btn-auth, .btn-logout {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-logout {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3);
        }

        .btn-auth:hover, .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }

        /* ===== 主容器 ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 40px 40px 40px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        h1.lobby-title {
            color: #fff;
            text-align: center;
            font-size: 3rem;
            margin-bottom: 50px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
        }

        /* ===== 遊戲卡片網格 ===== */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .game-card:hover::before { left: 100%; }

        .game-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 242, 254, 0.5);
            box-shadow: 0 15px 30px rgba(0, 242, 254, 0.2);
        }

        .game-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .game-card:hover .game-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .game-title {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .game-desc {
            color: #8fa0a3;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* ===== 嵌入遊戲區域 ===== */
        #gameArea {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
        }

        #gameFrame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            z-index: 101;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: #fff;
            color: #000;
        }

        /* ===== 排行榜區塊 ===== */
        #leaderboard {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px 20px 0 0;
            padding: 20px;
            margin-top: 50px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
            transition: all 0.4s ease;
        }

        #leaderboard.collapsed {
            transform: translateY(calc(100% - 60px));
            position: fixed;
            bottom: 0; left: 50%;
            transform: translateX(-50%) translateY(calc(100% - 60px));
            width: calc(100% - 80px);
            max-width: 1200px;
            margin-top: 0;
        }

        .lb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            margin-bottom: 20px;
            cursor: pointer;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .lb-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
        }

        .lb-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .lb-tab {
            color: #8fa0a3;
            padding: 6px 16px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
            white-space: nowrap;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .lb-tab:hover, .lb-tab.active {
            color: #fff;
            background: rgba(0, 242, 254, 0.2);
            border-color: rgba(0, 242, 254, 0.4);
        }

        .lb-table {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            text-align: left;
        }

        .lb-table th, .lb-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .lb-table th {
            color: #8fa0a3;
            font-weight: normal;
            font-size: 0.9rem;
        }

        .lb-table tr:hover td {
            background: rgba(255,255,255,0.02);
        }

        .rank-1 { color: #ffd700; font-weight: bold; }
        .rank-2 { color: #c0c0c0; font-weight: bold; }
        .rank-3 { color: #cd7f32; font-weight: bold; }

        .no-data {
            text-align: center;
            color: #8fa0a3;
            padding: 30px !important;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="header">
        <div class="user-info" id="userInfo">
            </div>
    </div>

    <div class="container" id="lobbyContainer">
        <h1 class="lobby-title">🕹️ 經典遊戲大廳</h1>
        
        <div class="game-grid">
            <div class="game-card" data-game="2048">
                <span class="game-icon">🔢</span>
                <h3 class="game-title">2048</h3>
                <p class="game-desc">經典方塊數字合併遊戲，滑動方塊合成出 2048 吧！</p>
            </div>
            <div class="game-card" data-game="snake">
                <span class="game-icon">🐍</span>
                <h3 class="game-title">貪吃蛇</h3>
                <p class="game-desc">控制小蛇吞食果實，注意不要撞到牆壁或自己。機甲風格畫風！</p>
            </div>
            <div class="game-card" data-game="maze">
                <span class="game-icon">🧭</span>
                <h3 class="game-title">逃出深淵 (迷宮)</h3>
                <p class="game-desc">迷宮探險！閃避隨機遊蕩的怪物，尋找通往下一關的終點。</p>
            </div>
            <div class="game-card" data-game="minesweeper">
                <span class="game-icon">💣</span>
                <h3 class="game-title">經典踩地雷</h3>
                <p class="game-desc">運用邏輯推演找出所有藏在網格底下的危險地雷。</p>
            </div>
            <div class="game-card" data-game="dino">
                <span class="game-icon">🦖</span>
                <h3 class="game-title">小恐龍</h3>
                <p class="game-desc">點擊跳躍，躲避仙人掌與翼龍，看看你能跑多遠！</p>
            </div>
            <div class="game-card" data-game="sudoku">
                <span class="game-icon">🧩</span>
                <h3 class="game-title">數獨挑戰</h3>
                <p class="game-desc">經典九宮格邏輯填數字遊戲，用最短的時間填滿所有正確格子！</p>
            </div>
        </div>

        <div id="leaderboard">
            <div class="lb-header" id="leaderboardHeader">
                <div class="lb-title">📊 頂尖玩家排行榜 (TOP 10)</div>
                <div class="lb-tabs" id="lbTabs">
                    <div class="lb-tab active" data-game="2048">2048</div>
                    <div class="lb-tab" data-game="snake">貪吃蛇</div>
                    <div class="lb-tab" data-game="maze">逃出深淵</div>
                    <div class="lb-tab" data-game="minesweeper">踩地雷</div>
                    <div class="lb-tab" data-game="dino">小恐龍</div>
                    <div class="lb-tab" data-game="sudoku">數獨</div>
                </div>
            </div>
            <table class="lb-table">
                <thead>
                    <tr>
                        <th style="width: 80px;">名次</th>
                        <th>玩家暱稱</th>
                        <th style="text-align: right;">最高紀錄</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="gameArea">
        <button class="btn-back" id="backBtn">⬅ 離開遊戲</button>
        <iframe id="gameFrame" src=""></iframe>
    </div>

    <script>
        // 常數配置
        const STORAGE_KEYS = {
            currentUser: 'currentUser',
            players: 'players'
        };

        const gameFiles = {
            '2048': '2048.html',
            'snake': 'snake.html',
            'maze': 'maze.html',
            'minesweeper': 'minesweeper.html',
            'dino': 'dino.html',
            'sudoku': 'sudoku.html'
        };

        // DOM 元素選取
        const userInfoEl = document.getElementById('userInfo');
        const lobbyContainer = document.getElementById('lobbyContainer');
        const gameArea = document.getElementById('gameArea');
        const gameFrame = document.getElementById('gameFrame');
        const backBtn = document.getElementById('backBtn');
        const gameCards = document.querySelectorAll('.game-card');
        const leaderboard = document.getElementById('leaderboard');
        const leaderboardHeader = document.getElementById('leaderboardHeader');
        const leaderboardBody = document.getElementById('leaderboardBody');
        const lbTabs = document.querySelectorAll('.lb-tab');

        // ===== 使用者狀態認證 =====
        function getCurrentUser() {
            const userJson = localStorage.getItem(STORAGE_KEYS.currentUser);
            return userJson ? JSON.parse(userJson) : null;
        }

        function renderUserHeader() {
            const currentUser = getCurrentUser();
            if (currentUser) {
                userInfoEl.innerHTML = `
                    <span class="user-name">👤 在線玩家：${currentUser.username}</span>
                    <button class="btn-logout" id="logoutBtn">登出系統</button>
                `;
                document.getElementById('logoutBtn').addEventListener('click', () => {
                    localStorage.removeItem(STORAGE_KEYS.currentUser);
                    renderUserHeader();
                });
            } else {
                userInfoEl.innerHTML = `
                    <a href="login.html" class="btn-auth">🔐 登入 / 註冊帳號</a>
                `;
            }
        }

        // ===== 遊戲開啟與登入防護 =====
        function checkLoginAndOpenGame(gameName) {
            const currentUser = getCurrentUser();
            if (!currentUser) {
                alert('⚠️ 請先登入或註冊帳號，才能開啟遊戲並儲存排行榜數據！');
                window.location.href = 'login.html';
                return;
            }

            // 切換至 iframe 檢視
            lobbyContainer.style.opacity = '0';
            setTimeout(() => {
                gameFrame.src = gameFiles[gameName];
                gameArea.style.display = 'block';
                document.body.style.overflow = 'hidden';
            }, 300);
        }

        function closeGame() {
            gameArea.style.display = 'none';
            gameFrame.src = '';
            document.body.style.overflow = 'auto';
            lobbyContainer.style.opacity = '1';
            // 離開遊戲時刷新目前選取分頁的排行榜
            const activeTab = document.querySelector('.lb-tab.active');
            if (activeTab) renderLeaderboard(activeTab.dataset.game);
        }

        // ===== 排行榜數據處理機制 =====
        function getLeaderboardData(game) {
            const playersJson = localStorage.getItem(STORAGE_KEYS.players);
            if (!playersJson) return [];

            const players = JSON.parse(playersJson);
            const records = [];

            // 提取各玩家該遊戲的成績
            for (const username in players) {
                if (players[username].scores && players[username].scores[game] !== undefined) {
                    records.push({
                        username: username,
                        score: players[username].scores[game]
                    });
                }
            }

            // 決定排序方式：時間類遊戲（迷宮、地雷、數獨）用正數秒數儲存，秒數越少（越快）排名越前
            const isTimeGame = (game === 'maze' || game === 'minesweeper' || game === 'sudoku');
            
            if (isTimeGame) {
                records.sort((a, b) => a.score - b.score);
            } else {
                records.sort((a, b) => b.score - a.score);
            }

            // 取前 10 名
            return records.slice(0, 10);
        }

        function renderLeaderboard(game) {
            const records = getLeaderboardData(game);
            leaderboardBody.innerHTML = '';

            if (records.length === 0) {
                leaderboardBody.innerHTML = `<tr><td colspan="3" class="no-data">暫無玩家紀錄，快來搶佔第一名！</td></tr>`;
                return;
            }

            const isTimeGame = (game === 'maze' || game === 'minesweeper' || game === 'sudoku');

            records.forEach((row, index) => {
                const rank = index + 1;
                let rankClass = '';
                if (rank === 1) rankClass = 'rank-1';
                else if (rank === 2) rankClass = 'rank-2';
                else if (rank === 3) rankClass = 'rank-3';

                let scoreDisplay = isTimeGame ? `${row.score} 秒` : `${row.score} 分`;

                leaderboardBody.innerHTML += `
                    <tr>
                        <td class="${rankClass}">#${rank}</td>
                        <td>${row.username}</td>
                        <td style="text-align: right; font-weight: bold; color: ${rank <= 3 ? '#00f2fe' : '#fff'}">${scoreDisplay}</td>
                    </tr>
                `;
            });
        }

        function updateScore(game, username, newScore) {
            const playersJson = localStorage.getItem(STORAGE_KEYS.players);
            const players = playersJson ? JSON.parse(playersJson) : {};

            if (!players[username]) {
                players[username] = { scores: {} };
            }
            if (!players[username].scores) {
                players[username].scores = {};
            }

            const oldScore = players[username].scores[game];
            const isTimeGame = (game === 'maze' || game === 'minesweeper' || game === 'sudoku');

            if (oldScore === undefined) {
                players[username].scores[game] = newScore;
            } else {
                if (isTimeGame) {
                    // 時間類：秒數越少越好
                    if (newScore < oldScore) players[username].scores[game] = newScore;
                } else {
                    // 分數類：數值越大越好
                    if (newScore > oldScore) players[username].scores[game] = newScore;
                }
            }

            localStorage.setItem(STORAGE_KEYS.players, JSON.stringify(players));
            renderLeaderboard(game);
        }

        // ===== 事件監聽綁定 =====
        gameCards.forEach(card => {
            card.addEventListener('click', () => {
                const gameName = card.dataset.game;
                checkLoginAndOpenGame(gameName);
            });
        });

        backBtn.addEventListener('click', closeGame);

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && gameArea.style.display === 'block') {
                closeGame();
            }
        });

        leaderboardHeader.addEventListener('click', (e) => {
            // 防止點擊頁籤也把面板收合
            if (e.target.classList.contains('lb-tab')) return;
            leaderboard.classList.toggle('collapsed');
        });

        lbTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                lbTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderLeaderboard(tab.dataset.game);
            });
        });

        // ===== 優化 iframe 分數接收機制 =====
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'gameScore') {
                const currentUser = getCurrentUser();
                if (currentUser) {
                    // 統一轉為正數處理（數獨在 checkWin 會回傳正數秒數）
                    updateScore(e.data.game, currentUser.username, Math.abs(e.data.score));
                }
            }
        });

        // ===== 初始化程序 =====
        renderUserHeader();
        renderLeaderboard('2048'); // 預設顯示 2048 排行榜
    </script>
</body>
</html>
