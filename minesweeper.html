  <!DOCTYPE html>
  <html lang="zh-TW">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>💣 踩地雷</title>
      <style>
          * {
              margin: 0;
              padding: 0;
              box-sizing: border-box;
          }

          body {
              min-height: 100vh;
              background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
              font-family: 'Segoe UI', Arial, sans-serif;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              padding: 20px;
              color: #fff;
          }

          h1 {
              font-size: 2rem;
              margin-bottom: 20px;
              text-shadow: 0 0 20px rgba(255,255,255,0.3);
          }

          /* 控制面板 */
          .controls {
              display: flex;
              gap: 20px;
              margin-bottom: 20px;
              flex-wrap: wrap;
              justify-content: center;
              align-items: center;
          }

          .control-group {
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 5px;
          }

          .control-group label {
              font-size: 0.85rem;
              color: rgba(255,255,255,0.7);
          }

          .control-group select, .control-group input {
              padding: 8px 12px;
              border-radius: 8px;
              border: 1px solid rgba(255,255,255,0.2);
              background: rgba(255,255,255,0.1);
              color: #fff;
              font-size: 1rem;
              cursor: pointer;
          }

          .control-group select:focus, .control-group input:focus {
              outline: none;
              border-color: rgba(255,255,255,0.5);
          }

          #bombCount {
              width: 70px;
              text-align: center;
          }

          #newGameBtn {
              padding: 10px 30px;
              border-radius: 25px;
              border: none;
              background: linear-gradient(135deg, #e74c3c, #c0392b);
              color: #fff;
              font-size: 1rem;
              font-weight: bold;
              cursor: pointer;
              transition: transform 0.2s, box-shadow 0.2s;
          }

          #newGameBtn:hover {
              transform: scale(1.05);
              box-shadow: 0 5px 20px rgba(231,76,60,0.4);
          }

          /* 遊戲狀態列 */
          .status-bar {
              display: flex;
              gap: 40px;
              margin-bottom: 15px;
              font-size: 1.2rem;
          }

          .status-item {
              display: flex;
              align-items: center;
              gap: 8px;
          }

          .status-item span {
              color: #f39c12;
              font-weight: bold;
              font-family: monospace;
              min-width: 40px;
          }

          /* 遊戲棋盤 */
          .board {
              display: grid;
              gap: 2px;
              background: rgba(0,0,0,0.3);
              padding: 10px;
              border-radius: 10px;
              box-shadow: 0 10px 30px rgba(0,0,0,0.3);
          }

          .cell {
              width: 30px;
              height: 30px;
              display: flex;
              align-items: center;
              justify-content: center;
              font-weight: bold;
              font-size: 14px;
              cursor: pointer;
              border-radius: 4px;
              transition: all 0.1s;
              user-select: none;
          }

          .cell.hidden {
              background: linear-gradient(145deg, #7f8c8d, #606060);
              box-shadow: inset 0 -2px 0 rgba(0,0,0,0.3), inset 0 2px 0 rgba(255,255,255,0.1);
          }

          .cell.hidden:hover {
              background: linear-gradient(145deg, #8f9c9d, #707070);
          }

          .cell.revealed {
              background: #2c3e50;
              cursor: default;
          }

          .cell.mine {
              background: linear-gradient(145deg, #e74c3c, #c0392b);
          }

          .cell.flag {
              background: linear-gradient(145deg, #7f8c8d, #606060);
          }

          .cell.flag::after {
              content: '🚩';
          }

          /* 數字顏色 */
          .cell.n1 { color: #3498db; }
          .cell.n2 { color: #2ecc71; }
          .cell.n3 { color: #e74c3c; }
          .cell.n4 { color: #9b59b6; }
          .cell.n5 { color: #e67e22; }
          .cell.n6 { color: #1abc9c; }
          .cell.n7 { color: #2c3e50; }
          .cell.n8 { color: #7f8c8d; }

          /* 遊戲結束訊息 */
          .message {
              position: fixed;
              top: 50%;
              left: 50%;
              transform: translate(-50%, -50%);
              background: rgba(0,0,0,0.9);
              padding: 40px 60px;
              border-radius: 20px;
              text-align: center;
              display: none;
              z-index: 1000;
              box-shadow: 0 0 50px rgba(0,0,0,0.5);
          }

          .message.show {
              display: block;
          }

          .message h2 {
              font-size: 2rem;
              margin-bottom: 20px;
          }

          .message.win h2 { color: #2ecc71; }
          .message.lose h2 { color: #e74c3c; }

          .message p {
              color: rgba(255,255,255,0.7);
              margin-bottom: 20px;
          }

          .message button {
              padding: 12px 30px;
              border-radius: 25px;
              border: none;
              background: linear-gradient(135deg, #3498db, #2980b9);
              color: #fff;
              font-size: 1rem;
              cursor: pointer;
              transition: transform 0.2s;
          }

          .message button:hover {
              transform: scale(1.05);
          }

          /* 覆蓋層 */
          .overlay {
              position: fixed;
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              background: rgba(0,0,0,0.7);
              display: none;
              z-index: 999;
          }

          .overlay.show {
              display: block;
          }
      </style>
  </head>
  <body>
      <h1>💣 踩地雷</h1>

      <div class="controls">
          <div class="control-group">
              <label>網格大小</label>
              <select id="gridSize">
                  <option value="10">10 × 10</option>
                  <option value="20">20 × 20</option>
                  <option value="30">30 × 30</option>
              </select>
          </div>

          <div class="control-group">
              <label>難度</label>
              <select id="difficulty">
                  <option value="easy">簡單 (10%)</option>
                  <option value="medium" selected>中等 (15%)</option>
                  <option value="hard">困難 (20%)</option>
                  <option value="custom">自訂炸彈數</option>
              </select>
          </div>

          <div class="control-group">
              <label>炸彈數量</label>
              <input type="number" id="bombCount" min="1" value="15">
          </div>

          <button id="newGameBtn">新遊戲</button>
      </div>

      <div class="status-bar">
          <div class="status-item">
              💣 <span id="mineCount">15</span>
          </div>
          <div class="status-item">
              🚩 <span id="flagCount">0</span>
          </div>
          <div class="status-item">
              ⏱️ <span id="timer">0</span>
          </div>
      </div>

      <div class="board" id="board"></div>

      <div class="overlay" id="overlay"></div>
      <div class="message" id="message">
          <h2 id="messageTitle">遊戲結束</h2>
          <p id="messageText"></p>
          <button onclick="hideMessage()">再玩一次</button>
      </div>

      <script>
          // 遊戲狀態
          let board = [];
          let revealed = [];
          let flagged = [];
          let gameOver = false;
          let gameWon = false;
          let timerInterval = null;
          let seconds = 0;
          let gridSize = 10;
          let totalMines = 15;
          let firstClick = true;

          // DOM 元素
          const boardEl = document.getElementById('board');
          const gridSizeSelect = document.getElementById('gridSize');
          const difficultySelect = document.getElementById('difficulty');
          const bombCountInput = document.getElementById('bombCount');
          const mineCountEl = document.getElementById('mineCount');
          const flagCountEl = document.getElementById('flagCount');
          const timerEl = document.getElementById('timer');
          const messageEl = document.getElementById('message');
          const messageTitleEl = document.getElementById('messageTitle');
          const messageTextEl = document.getElementById('messageText');
          const overlayEl = document.getElementById('overlay');
          const newGameBtn = document.getElementById('newGameBtn');

          // 難度預設炸彈比例
          const difficultyRatios = {
              easy: 0.10,
              medium: 0.15,
              hard: 0.20
          };

          // 初始化遊戲
          function initGame() {
              // 讀取設定
              gridSize = parseInt(gridSizeSelect.value);
              const difficulty = difficultySelect.value;

              if (difficulty === 'custom') {
                  totalMines = parseInt(bombCountInput.value) || Math.floor(gridSize * gridSize * 0.15);
              } else {
                  totalMines = Math.floor(gridSize * gridSize * difficultyRatios[difficulty]);
              }

              // 限制炸彈數量
              const maxMines = gridSize * gridSize - 9; // 保留點擊位置周圍 3x3 區域
              if (totalMines > maxMines) totalMines = maxMines;
              if (totalMines < 1) totalMines = 1;
              bombCountInput.value = totalMines;

              // 重置狀態
              gameOver = false;
              gameWon = false;
              firstClick = true;
              seconds = 0;
              clearInterval(timerInterval);
              timerEl.textContent = '0';

              // 更新顯示
              mineCountEl.textContent = totalMines;
              flagCountEl.textContent = '0';

              // 初始化數組
              const size = gridSize;
              board = Array(size).fill(null).map(() => Array(size).fill(0));
              revealed = Array(size).fill(null).map(() => Array(size).fill(false));
              flagged = Array(size).fill(null).map(() => Array(size).fill(false));

              // 繪製棋盤
              renderBoard();
          }

          // 放置炸彈（確保第一次點擊不炸到）
          function placeMines(excludeRow, excludeCol) {
              const size = gridSize;
              let minesPlaced = 0;

              while (minesPlaced < totalMines) {
                  const row = Math.floor(Math.random() * size);
                  const col = Math.floor(Math.random() * size);

                  // 排除第一次點擊周圍 3x3 區域
                  const isExcluded = Math.abs(row - excludeRow) <= 1 && Math.abs(col - excludeCol) <= 1;

                  if (!isExcluded && board[row][col] !== -1) {
                      board[row][col] = -1;
                      minesPlaced++;
                  }
              }

              // 計算每格的數字
              for (let r = 0; r < size; r++) {
                  for (let c = 0; c < size; c++) {
                      if (board[r][c] !== -1) {
                          board[r][c] = countAdjacentMines(r, c);
                      }
                  }
              }
          }

          // 計算周圍炸彈數
          function countAdjacentMines(row, col) {
              let count = 0;
              for (let dr = -1; dr <= 1; dr++) {
                  for (let dc = -1; dc <= 1; dc++) {
                      if (dr === 0 && dc === 0) continue;
                      const r = row + dr;
                      const c = col + dc;
                      if (r >= 0 && r < gridSize && c >= 0 && c < gridSize && board[r][c] === -1) {
                          count++;
                      }
                  }
              }
              return count;
          }

          // 渲染棋盤
          function renderBoard() {
              boardEl.innerHTML = '';
              boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 30px)`;
              boardEl.style.gridTemplateRows = `repeat(${gridSize}, 30px)`;

              for (let r = 0; r < gridSize; r++) {
                  for (let c = 0; c < gridSize; c++) {
                      const cell = document.createElement('div');
                      cell.className = 'cell hidden';
                      cell.dataset.row = r;
                      cell.dataset.col = c;
                      cell.addEventListener('click', handleClick);
                      cell.addEventListener('contextmenu', handleRightClick);
                      boardEl.appendChild(cell);
                  }
              }
          }

          // 更新單個格子的顯示
          function updateCell(row, col) {
              const index = row * gridSize + col;
              const cell = boardEl.children[index];

              if (revealed[row][col]) {
                  cell.className = 'cell revealed';
                  if (board[row][col] === -1) {
                      cell.classList.add('mine');
                      cell.textContent = '💣';
                  } else if (board[row][col] > 0) {
                      cell.classList.add(`n${board[row][col]}`);
                      cell.textContent = board[row][col];
                  }
              } else if (flagged[row][col]) {
                  cell.className = 'cell flag';
              } else {
                  cell.className = 'cell hidden';
              }
          }

          // 左鍵點擊
          function handleClick(e) {
              if (gameOver || gameWon) return;

              const row = parseInt(e.target.dataset.row);
              const col = parseInt(e.target.dataset.col);

              if (flagged[row][col]) return;

              // 第一次點擊：放置炸彈並開始計時
              if (firstClick) {
                  firstClick = false;
                  placeMines(row, col);
                  startTimer();
              }

              reveal(row, col);
          }

          // 右鍵標記
          function handleRightClick(e) {
              e.preventDefault();
              if (gameOver || gameWon) return;

              const row = parseInt(e.target.dataset.row);
              const col = parseInt(e.target.dataset.col);

              if (revealed[row][col]) return;

              flagged[row][col] = !flagged[row][col];
              updateCell(row, col);
              updateFlagCount();
          }

          // 展開格子
          function reveal(row, col) {
              if (row < 0 || row >= gridSize || col < 0 || col >= gridSize) return;
              if (revealed[row][col] || flagged[row][col]) return;

              revealed[row][col] = true;
              updateCell(row, col);

              if (board[row][col] === -1) {
                  // 踩到炸彈
                  gameOver = true;
                  clearInterval(timerInterval);
                  revealAllMines();
                  showMessage(false);
                  return;
              }

              if (board[row][col] === 0) {
                  // 數字為 0，遞迴展開周圍
                  for (let dr = -1; dr <= 1; dr++) {
                      for (let dc = -1; dc <= 1; dc++) {
                          if (dr !== 0 || dc !== 0) {
                              reveal(row + dr, col + dc);
                          }
                      }
                  }
              }

              checkWin();
          }

          // 顯示所有炸彈
          function revealAllMines() {
              for (let r = 0; r < gridSize; r++) {
                  for (let c = 0; c < gridSize; c++) {
                      if (board[r][c] === -1) {
                          revealed[r][c] = true;
                          updateCell(r, c);
                      }
                  }
              }
          }

          // 檢查是否获胜
          function checkWin() {
              let unrevealed = 0;
              for (let r = 0; r < gridSize; r++) {
                  for (let c = 0; c < gridSize; c++) {
                      if (!revealed[r][c]) unrevealed++;
                  }
              }

              if (unrevealed === totalMines) {
                  gameWon = true;
                  clearInterval(timerInterval);
                  showMessage(true);
              }
          }

          // 計時器
          function startTimer() {
              timerInterval = setInterval(() => {
                  seconds++;
                  timerEl.textContent = seconds;
              }, 1000);
          }

          // 更新旗子計數
          function updateFlagCount() {
              let count = 0;
              for (let r = 0; r < gridSize; r++) {
                  for (let c = 0; c < gridSize; c++) {
                      if (flagged[r][c]) count++;
                  }
              }
              flagCountEl.textContent = count;
          }

          // 顯示遊戲結果
          function showMessage(won) {
              overlayEl.classList.add('show');
              messageEl.classList.add('show');
              messageEl.classList.remove('win', 'lose');
              messageEl.classList.add(won ? 'win' : 'lose');

              if (won) {
                  messageTitleEl.textContent = '🎉 恭喜過關！';
                  messageTextEl.textContent = `用了 ${seconds} 秒通關！`;
              } else {
                  messageTitleEl.textContent = '💥 踩到地雷了！';
                  messageTextEl.textContent = `堅持了 ${seconds} 秒`;
              }
          }

          // 隱藏訊息
          function hideMessage() {
              overlayEl.classList.remove('show');
              messageEl.classList.remove('show');
              initGame();
          }

          // 事件監聽
          gridSizeSelect.addEventListener('change', initGame);
          difficultySelect.addEventListener('change', () => {
              const difficulty = difficultySelect.value;
              if (difficulty === 'custom') {
                  bombCountInput.disabled = false;
              } else {
                  bombCountInput.disabled = true;
                  initGame();
              }
          });
          bombCountInput.addEventListener('change', initGame);
          newGameBtn.addEventListener('click', initGame);

          // 啟動遊戲
          initGame();
      </script>
  </body>
  </html>
