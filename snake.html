<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貪吃蛇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        h1 {
            color: #4ade80;
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #4ade80;
        }
        #gameCanvas {
            border: 4px solid #4ade80;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
        }
        .score {
            color: #fff;
            font-size: 1.5rem;
            margin: 15px 0;
        }
        .instructions {
            color: #888;
            font-size: 0.9rem;
            margin-top: 15px;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .hidden { display: none !important; }
        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: #4ade80;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.1s;
        }
        button:hover {
            transform: scale(1.05);
            background: #22c55e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>貪吃蛇</h1>
        <div class="score">分數: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <p class="instructions">使用鍵盤 ↑ ↓ ← → 或 WASD 操控蛇的移動</p>

        <div id="gameOver" class="overlay hidden">
            <h2 style="font-size:2rem;color:#ef4444;">遊戲結束</h2>
            <p style="font-size:1.5rem;margin-top:10px;">最終分數: <span id="finalScore">0</span></p>
            <button id="restartBtn">再玩一次</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverEl = document.getElementById('gameOver');
        const restartBtn = document.getElementById('restartBtn');

        const GRID_SIZE = 20;
        const GRID_COUNT = canvas.width / GRID_SIZE;

        let snake, direction, nextDirection, food, score, gameLoop, gameRunning;

        function init() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            scoreEl.textContent = '0';
            gameOverEl.classList.add('hidden');
            gameRunning = true;
            spawnFood();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 150);
        }

        function spawnFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * GRID_COUNT),
                    y: Math.floor(Math.random() * GRID_COUNT)
                };
            } while (snake.some(s => s.x === food.x && s.y === food.y));
        }

        function update() {
            if (!gameRunning) return;
            direction = { ...nextDirection };

            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            if (head.x < 0 || head.x >= GRID_COUNT ||
                head.y < 0 || head.y >= GRID_COUNT ||
                snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#4ade80';
            snake.forEach((s, i) => {
                ctx.fillStyle = i === 0 ? '#22c55e' : '#4ade80';
                ctx.fillRect(s.x * GRID_SIZE + 1, s.y * GRID_SIZE + 1,
                           GRID_SIZE - 2, GRID_SIZE - 2);
            });

            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2,
                   food.y * GRID_SIZE + GRID_SIZE/2,
                   GRID_SIZE/2 - 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            finalScoreEl.textContent = score;
            gameOverEl.classList.remove('hidden');
        }

        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            const key = e.key.toLowerCase();
            if ((key === 'arrowup' || key === 'w') && direction.y !== 1)
                nextDirection = { x: 0, y: -1 };
            else if ((key === 'arrowdown' || key === 's') && direction.y !== -1)
                nextDirection = { x: 0, y: 1 };
            else if ((key === 'arrowleft' || key === 'a') && direction.x !== 1)
                nextDirection = { x: -1, y: 0 };
            else if ((key === 'arrowright' || key === 'd') && direction.x !== -1)
                nextDirection = { x: 1, y: 0 };
        });

        restartBtn.addEventListener('click', init);
        init();
    </script>
</body>
</html>
